<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BINAR AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">

    <!-- Bagian kiri: Profile + Nama -->
    <div class="header-left">

        <div class="profile-icon">
            👤
        </div>

        <div class="header-title">
            <h2>Binar Komputer Assistant</h2>
            <p>Siap membantu Anda!</p>
        </div>

    </div>


    <!-- Bagian kanan: Status -->
    <div class="online-status">
        <span class="online-dot"></span>
        Online
    </div>

</div>


        <!-- Area Percakapan -->
         <div class="chat-box">

    <!-- Pesan pertama dari AI -->
    <div class="message ai-message">
        Halo! 👋 Selamat datang di Binar Assistant.
        Ada yang bisa saya bantu?
    </div>


    <!-- Quick Reply di bawah sapaan AI -->
    <div class="quick-replies">
        <button>📚 Info Kursus</button>
        <button>📅 Jadwal Kelas</button>
        <button>💻 Program / Promo</button>
    </div>

</div>
        <!-- Input Pesan -->
        <div class="chat-input">
            <input type="text" placeholder="Ketik pertanyaan Anda...">
            <button>Kirim ➤</button>
        </div>

    </div>
    <script src="knowledge.js"></script>
    <script src="script.js"></script>
</body>
</html>
