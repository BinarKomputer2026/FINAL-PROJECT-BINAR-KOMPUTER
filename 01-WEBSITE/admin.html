<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Binar Komputer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .status {
            background: #dbeafe;
            color: #1e40af;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #1e3a8a;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Admin Dashboard</h1>
        <p>Binar Komputer Tegal</p>
    </div>

    <div class="container">

        <div class="cards">

            <div class="card">
                <h3>Total Pendaftar</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Pendaftar Baru</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Status Sistem</h3>
                <div class="number">Aktif</div>
            </div>

        </div>

        <div class="table-box">

            <h2>Pendaftaran Terbaru</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID Pendaftaran</th>
                        <th>Nama</th>
                        <th>Program</th>
                        <th>Status</th>
                        <th>Waktu Daftar</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>-</td>
                        <td>Belum ada data</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>

        </div>

        <a href="index.html" class="back">← Kembali ke Website</a>

    </div>

    <script>

const API_URL = "https://script.google.com/macros/s/AKfycbwDfMU41_fdPtq5I9rpmIwTft3Bd3MqAwxY-11gaQSwYA2nVYn41OTLBPIQGA66KhnM/exec";

fetch(API_URL)
    .then(response => response.json())
    .then(data => {

        // Total pendaftar
        document.querySelectorAll(".number")[0].textContent = data.length;

        // Pendaftar baru
        const pendaftarBaru = data.filter(
            item => item["STATUS PENDAFTARAN"] === "Baru"
        ).length;

        document.querySelectorAll(".number")[1].textContent = pendaftarBaru;

        // Tabel
        const tbody = document.querySelector("tbody");

        tbody.innerHTML = "";

        data.slice().reverse().forEach(item => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${item["ID PENDAFTARAN"] || "-"}</td>
                <td>${item["NAMA LENGKAP"] || "-"}</td>
                <td>${item["PROGRAM YANG DIMINATI"] || "-"}</td>
                <td>
                    <span class="status">
                        ${item["STATUS PENDAFTARAN"] || "-"}
                    </span>
                </td>
                <td>${item["WAKTU DAFTAR"] || "-"}</td>
            `;

            tbody.appendChild(row);

        });

    })
    .catch(error => {
        console.error("Gagal mengambil data:", error);
    });

</script>


</body>
</html>
