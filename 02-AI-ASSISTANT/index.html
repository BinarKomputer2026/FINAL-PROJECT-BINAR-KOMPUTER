<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binar AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">
<!-- =========================
     HEADER
     ========================= -->

<div class="chat-header">

    <div class="header-left">
        <a
    href="../"
    id="backHomeButton"
    class="back-home-button"
    title="Kembali ke Website">
    ←
</a>

        <div class="profile-icon">

            <img
                src="assets/logo-binar.jpeg"
                alt="Logo Binar Komputer">

        </div>

        <div class="header-title">

            <h2>Binar Komputer</h2>

            <div class="online-status">

                <span class="online-dot"></span>

                Online

            </div>

        </div>

    </div>


    <div class="header-right">

        <div class="menu-wrapper">

            <button
                id="menuButton"
                class="header-button menu-button"
                title="Menu">
                ⋮
            </button>


            <div
                id="menuDropdown"
                class="menu-dropdown">

                <button
                    id="clearChatButton"
                    class="menu-item">
                    🗑️ Bersihkan Chat
                </button>

                <button
                    id="darkModeButton"
                    class="menu-item">
                    🌙 Mode Gelap
                </button>

                <button
                    id="chatHistoryButton"
                    class="menu-item">
                    💬 Riwayat Chat
                </button>

                <button
                    id="deleteHistoryButton"
                    class="menu-item">
                    🗑️ Hapus Riwayat Chat
                </button>

            </div>

        </div>

    </div>

</div>
          
        <!-- =========================
             AREA PERCAKAPAN
             ========================= -->
        <div class="chat-box">

            <!-- Pesan pertama dari AI -->
            <div class="message ai-message">

                Halo! 👋 Selamat datang di Binar Assistant.
                Ada yang bisa saya bantu?

            </div>


            <!-- Quick Reply -->
            <div class="quick-replies">

                <button>📚 Info Kursus</button>

                <button>📅 Jadwal Kelas</button>

                <button>📍 Lokasi</button>

            </div>

        </div>


        <!-- =========================
             INPUT PESAN
             ========================= -->
        <div class="chat-input">

            <input
                type="text"
                placeholder="Ketik pertanyaan Anda...">

            <button>
                Kirim ➤
            </button>

        </div>

    </div>
<!-- =========================
     RIWAYAT CHAT
     ========================= -->

<div id="historyModal" class="history-modal">

    <div class="history-panel">

        <div class="history-header">

            <h3>💬 Riwayat Chat</h3>

            <button id="closeHistoryButton">
                ×
            </button>

        </div>

        <div id="historyList" class="history-list">

            <p class="empty-history">
                Belum ada riwayat chat.
            </p>

        </div>

    </div>

</div>

    <!-- JavaScript -->
    <script src="knowledge.js"></script>
    <script src="script.js"></script>

</body>

</html>
